# Una consulta diaria a Supabase para que el proyecto gratuito no se pause tras 7 días sin actividad
# (por ejemplo, en vacaciones). Usa la clave pública de js/config.js y la función public.keepalive(),
# que no lee ni cambia datos. Se puede lanzar a mano en GitHub → Actions → «Mantener Supabase activo» → Run workflow.
# Ojo: GitHub desactiva las tareas programadas si el repositorio pasa 60 días sin cambios; te avisa por correo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '23 5 * * *'   # cada día hacia las 6:23 (hora de Madrid en invierno)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consulta diaria a Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" js/config.js)
          curl -fsS --retry 3 -X POST "${URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase ha respondido."
